<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota 2 Stats</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🎮 Dota 2 Stats</h1>
        <div id="auth-block">
            <a href="/login" id="login-btn">Войти через Steam</a>
        </div>
    </header>

    <main>
        <!-- Три колонки: друзья | центр | пиры + герои -->
        <div id="player-layout" class="player-layout hidden">

            <!-- ЛЕВАЯ КОЛОНКА: Друзья -->
            <aside class="col-users">
                <h2>Друзья</h2>
                <div id="users-list" class="users-list"></div>
            </aside>

            <!-- ЦЕНТР -->
            <div class="col-main">

                <!-- Профиль + Общая статистика (одна строка) -->
                <div class="card">
                    <div class="profile-row">
                        <div id="profile-header" class="profile-header"></div>
                        <div id="stats-content" class="stats-block"></div>
                    </div>
                </div>

                <!-- 20 матчей + За патч -->
                <div class="row-two">
                    <div class="card">
                        <h3>Последние 20 матчей</h3>
                        <div id="recent-block"></div>
                    </div>
                    <div class="card">
                        <h3 id="patch-title">Статистика за патч</h3>
                        <div id="patch-block"></div>
                    </div>
                </div>

            </div>

            <!-- ПРАВАЯ КОЛОНКА: Пиры + Герои -->
            <aside class="col-peers">

                <!-- Карточка: Пиры -->
                <div class="card">
                    <h2>Сыграно с игроками</h2>
                    <div id="peers-block"></div>
                </div>

                <!-- Карточка: Герои -->
                <div class="card">
                    <div class="heroes-header">
                        <h2>Герои</h2>
                        <div class="toggle-group toggle-group--compact">
                            <button class="toggle-btn active" data-scope="all">Все</button>
                            <button class="toggle-btn" data-scope="patch">Патч</button>
                        </div>
                    </div>
                    <div id="heroes-list" class="heroes-list-compact"></div>
                </div>

            </aside>

        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
