<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="lK_Altfxdpcy019xv1Xa4SS_XCmOGQ0Dr1JlF4uTpD0" />
    <title>Dota 2 Stats</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🎮 Dota 2 Stats</h1>
        <div id="auth-block">
            <a href="/login" id="login-btn">Войти через Steam</a>
        </div>
    </header>

    <main>
        <section id="users-section">
            <h2>Друзья</h2>
            <div id="users-list" class="users-grid"></div>
        </section>

        <section id="stats-section" class="hidden">
            <div id="profile-header" class="profile-header"></div>

            <h3>Общая статистика</h3>
            <div id="stats-content" class="stats-block"></div>

            <h3>Последние 20 матчей</h3>
            <div id="recent-block"></div>

            <h3 id="patch-title">Статистика за патч</h3>
            <div id="patch-block"></div>

            <div class="section-header">
                <h3>Герои</h3>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-scope="all">За всё время</button>
                    <button class="toggle-btn" data-scope="patch">За патч</button>
                </div>
            </div>
            <div id="heroes-list" class="heroes-grid"></div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
